route:
  receiver: local-webhook
  group_by: [alertname, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: local-webhook
    webhook_configs:
      - url: http://webhook-sink:9080/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="critical"']
    target_matchers: ['severity="warning"']
    equal: [service]

