global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.local.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: coordinator
    metrics_path: /metrics
    static_configs:
      - targets: [coordinator:3000]
  - job_name: prove-queue
    metrics_path: /metrics
    static_configs:
      - targets: [queue:3005]
  - job_name: prometheus
    static_configs:
      - targets: [127.0.0.1:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
