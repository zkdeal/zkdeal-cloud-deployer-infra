global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { environment: hosted }

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: coordinator
    metrics_path: /metrics
    static_configs: [{ targets: [coordinator:3000] }]
  - job_name: hosted-indexer
    metrics_path: /metrics
    static_configs: [{ targets: [indexer:3001] }]
  - job_name: hosted-reconciler
    metrics_path: /metrics
    static_configs: [{ targets: [reconciler:3001] }]
  - job_name: hosted-publisher
    metrics_path: /metrics
    static_configs: [{ targets: [publisher:3002] }]
  - job_name: hosted-auto-claimer
    metrics_path: /metrics
    static_configs: [{ targets: [auto-claimer:3003] }]
  - job_name: hosted-capacity
    metrics_path: /metrics
    static_configs: [{ targets: [capacity-controller:3004] }]
  - job_name: headless-room-node
    metrics_path: /metrics
    static_configs: [{ targets: [headless-node:3100] }]
  - job_name: prover
    metrics_path: /metrics
    static_configs: [{ targets: [prover:8080] }]
  - job_name: prometheus
    static_configs: [{ targets: [127.0.0.1:9090] }]
  - job_name: alertmanager
    static_configs: [{ targets: [alertmanager:9093] }]
