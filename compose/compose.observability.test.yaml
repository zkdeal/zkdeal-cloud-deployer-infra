name: zkdeal-observability-acceptance
services:
  metrics-fixture:
    image: zkdeal-observability-metrics:acceptance
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  webhook-test:
    image: zkdeal-observability-webhook:acceptance
    read_only: true
    tmpfs: ["/tmp:size=8m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  alertmanager-test:
    image: zkdeal-observability-alertmanager:acceptance
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/tmp/alertmanager"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [webhook-test]

  prometheus-test:
    image: zkdeal-observability-prometheus:acceptance
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/tmp/prometheus"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on: [metrics-fixture, alertmanager-test]
