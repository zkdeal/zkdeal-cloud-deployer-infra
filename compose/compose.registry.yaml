name: zkdeal-local-oci-registry

services:
  registry:
    image: registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "false"
    ports:
      - "127.0.0.1:${OCI_REGISTRY_PORT:-5000}:5000"
    volumes:
      - registry-data:/var/lib/registry
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/v2/ >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 3s
    networks: [registry]

volumes:
  registry-data:
    name: "${OCI_REGISTRY_VOLUME:-zkdeal-oci-registry}"

networks:
  registry:
    internal: false
