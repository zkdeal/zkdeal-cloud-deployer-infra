services:
  deployment-tools:
    image: zkdeal-deployment-tools:local
    build:
      context: ..
      dockerfile: tools/Dockerfile
    working_dir: /workspace/cloud-deployer-infra
    entrypoint: ["python"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../..:/workspace:ro
      - ..:/workspace/cloud-deployer-infra:rw
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: bridge

  deployment-orchestrator:
    image: zkdeal-deployment-tools:local
    build:
      context: ..
      dockerfile: tools/Dockerfile
    profiles: ["orchestrator"]
    working_dir: /workspace/cloud-deployer-infra
    entrypoint: ["python"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../..:/workspace:ro
      - ..:/workspace/cloud-deployer-infra:rw
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    network_mode: bridge
