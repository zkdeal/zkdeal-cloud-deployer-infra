services:
  postgres:
    profiles: ["hosted", "conformance"]
    image: ${POSTGRES_IMAGE:-postgres:17.6-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zkdeal}
      POSTGRES_USER: ${POSTGRES_USER:-zkdeal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a local PostgreSQL password}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - type: bind
        source: ${ZKDEAL_STATE_DIR:-../.state/local}/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # The official entrypoint starts as root only to initialize/chown an empty
    # data volume, then drops to postgres. These are the bounded capabilities
    # observed by the live dependency acceptance; removing them makes the
    # container fail before pg_isready.
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks: [internal]

  minio:
    profiles: ["hosted", "conformance"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a local MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a local MinIO password}
    volumes:
      - type: bind
        source: ${ZKDEAL_STATE_DIR:-../.state/local}/minio
        target: /data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    networks: [internal]

  minio-init:
    profiles: ["hosted", "conformance"]
    image: ${MINIO_CLIENT_IMAGE:-minio/mc:RELEASE.2025-04-16T18-13-26Z}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing local/zkdeal-evidence;
        mc anonymous set none local/zkdeal-evidence
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set a local MinIO user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set a local MinIO password}
      # mc otherwise writes beneath /root, which is deliberately unavailable
      # to this capability-free one-shot container.
      MC_CONFIG_DIR: /tmp/.mc
    depends_on:
      minio: { condition: service_healthy }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [internal]
