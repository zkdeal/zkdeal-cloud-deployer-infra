    command: ["until curl -fsS http://web3signer-withdrawal:9000/upcheck >/dev/null; do sleep 2; done; while :; do sleep 30; done"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://web3signer-withdrawal:9000/upcheck"], interval: 5s, timeout: 3s, retries: 20 }
    depends_on: { web3signer-withdrawal: { condition: service_started } }
    networks: [signer-withdrawal]

  web3signer-blob:
    <<: *web3signer-production
    command: ["--http-listen-host=0.0.0.0", "--http-listen-port=9000", "--http-host-allowlist=web3signer-blob", "--key-store-path=/var/lib/web3signer/keys", "eth1", "--chain-id=${CHAIN_ID:?set chain ID}"]
    volumes: ["${WEB3SIGNER_BLOB_CONFIG_DIR:?set the blob-publisher signer configuration directory}:/var/lib/web3signer/keys:ro"]
