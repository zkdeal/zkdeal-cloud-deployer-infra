    command: ["--http-listen-host=0.0.0.0", "--http-listen-port=9000", "--http-host-allowlist=web3signer-payout", "--key-store-path=/var/lib/web3signer/keys", "eth1", "--chain-id=${CHAIN_ID:?set chain ID}"]
    volumes: ["${WEB3SIGNER_PAYOUT_CONFIG_DIR:?set the payout signer configuration directory}:/var/lib/web3signer/keys:ro"]
    networks: [signer-payout]

  web3signer-payout-health:
    <<: *web3signer-health
    command: ["until curl -fsS http://web3signer-payout:9000/upcheck >/dev/null; do sleep 2; done; while :; do sleep 30; done"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://web3signer-payout:9000/upcheck"], interval: 5s, timeout: 3s, retries: 20 }
    depends_on: { web3signer-payout: { condition: service_started } }
    networks: [signer-payout]

  web3signer-finality:
    <<: *web3signer-production
    command: ["--http-listen-host=0.0.0.0", "--http-listen-port=9000", "--http-host-allowlist=web3signer-finality", "--key-store-path=/var/lib/web3signer/keys", "eth1", "--chain-id=${CHAIN_ID:?set chain ID}"]
    volumes: ["${WEB3SIGNER_FINALITY_CONFIG_DIR:?set the finality signer configuration directory}:/var/lib/web3signer/keys:ro"]
    networks: [signer-finality]

  web3signer-finality-health:
    <<: *web3signer-health
    command: ["until curl -fsS http://web3signer-finality:9000/upcheck >/dev/null; do sleep 2; done; while :; do sleep 30; done"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://web3signer-finality:9000/upcheck"], interval: 5s, timeout: 3s, retries: 20 }
    depends_on: { web3signer-finality: { condition: service_started } }
    networks: [signer-finality]

  web3signer-sponsor:
    <<: *web3signer-production
    command: ["--http-listen-host=0.0.0.0", "--http-listen-port=9000", "--http-host-allowlist=web3signer-sponsor", "--key-store-path=/var/lib/web3signer/keys", "eth1", "--chain-id=${CHAIN_ID:?set chain ID}"]
    volumes: ["${WEB3SIGNER_SPONSOR_CONFIG_DIR:?set the sponsor signer configuration directory}:/var/lib/web3signer/keys:ro"]
    networks: [signer-sponsor]

  web3signer-sponsor-health:
    <<: *web3signer-health
    command: ["until curl -fsS http://web3signer-sponsor:9000/upcheck >/dev/null; do sleep 2; done; while :; do sleep 30; done"]
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://web3signer-sponsor:9000/upcheck"], interval: 5s, timeout: 3s, retries: 20 }
    depends_on: { web3signer-sponsor: { condition: service_started } }
    networks: [signer-sponsor]

  web3signer-withdrawal:
    <<: *web3signer-production
    command: ["--http-listen-host=0.0.0.0", "--http-listen-port=9000", "--http-host-allowlist=web3signer-withdrawal", "--key-store-path=/var/lib/web3signer/keys", "eth1", "--chain-id=${CHAIN_ID:?set chain ID}"]
    volumes: ["${WEB3SIGNER_WITHDRAWAL_CONFIG_DIR:?set the withdrawal signer configuration directory}:/var/lib/web3signer/keys:ro"]
    networks: [signer-withdrawal]

  web3signer-withdrawal-health:
