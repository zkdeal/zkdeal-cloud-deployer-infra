    depends_on: { web3signer-blob: { condition: service_started } }
    networks: [signer-blob]

networks:
  signer-liveness: { internal: true }
  signer-operations: { internal: true }
  signer-payout: { internal: true }
  signer-finality: { internal: true }
  signer-sponsor: { internal: true }
  signer-withdrawal: { internal: true }
  signer-blob: { internal: true }
