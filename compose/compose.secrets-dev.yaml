services:
  openbao:
    profiles: ["secrets-dev"]
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6.1}
    command: ["server", "-dev", "-config=/openbao/config/dev.hcl", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:?set a local OpenBao token}"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    volumes:
      - ./openbao/dev.hcl:/openbao/config/dev.hcl:ro
      - type: bind
        source: ${ZKDEAL_STATE_DIR:-../.state/local}/openbao-audit
        target: /var/log/openbao
    expose: ["8200"]
    healthcheck:
      test: ["CMD", "bao", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 20
    cap_drop: ["ALL"]
    cap_add: ["IPC_LOCK"]
    security_opt: ["no-new-privileges:true"]
    mem_swappiness: 0
    networks: [internal]

  openbao-init:
    profiles: ["secrets-dev"]
    image: ${OPENBAO_IMAGE:-openbao/openbao:2.6.1}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        export BAO_ADDR=http://openbao:8200 BAO_TOKEN="$${OPENBAO_DEV_ROOT_TOKEN}";
        bao secrets enable -path=zkdeal kv-v2 || true;
        bao status
    environment:
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:?set a local OpenBao token}
    volumes:
      - type: bind
        source: ${ZKDEAL_STATE_DIR:-../.state/local}/openbao-audit
        target: /var/log/openbao
    depends_on:
      openbao: { condition: service_healthy }
    restart: "no"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]
