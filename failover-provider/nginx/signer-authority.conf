worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  proxy_connect_timeout 2s;
  proxy_read_timeout 10s;
  server {
    listen 8080;
    server_name signer-authority;
    location = /health/operations { proxy_set_header Host web3signer-operations; proxy_pass http://web3signer-operations:9000/upcheck; }
    location = /health/payout { proxy_set_header Host web3signer-payout; proxy_pass http://web3signer-payout:9000/upcheck; }
    location = /health/finality { proxy_set_header Host web3signer-finality; proxy_pass http://web3signer-finality:9000/upcheck; }
    location = /health/sponsor { proxy_set_header Host web3signer-sponsor; proxy_pass http://web3signer-sponsor:9000/upcheck; }
    location = /health/withdrawal { proxy_set_header Host web3signer-withdrawal; proxy_pass http://web3signer-withdrawal:9000/upcheck; }
    location = /health/blob { proxy_set_header Host web3signer-blob; proxy_pass http://web3signer-blob:9000/upcheck; }
    location /operations/ { proxy_set_header Host web3signer-operations; proxy_pass http://web3signer-operations:9000/; }
    location /payout/ { proxy_set_header Host web3signer-payout; proxy_pass http://web3signer-payout:9000/; }
    location /finality/ { proxy_set_header Host web3signer-finality; proxy_pass http://web3signer-finality:9000/; }
    location /sponsor/ { proxy_set_header Host web3signer-sponsor; proxy_pass http://web3signer-sponsor:9000/; }
    location /withdrawal/ { proxy_set_header Host web3signer-withdrawal; proxy_pass http://web3signer-withdrawal:9000/; }
    location /blob/ { proxy_set_header Host web3signer-blob; proxy_pass http://web3signer-blob:9000/; }
  }
}
