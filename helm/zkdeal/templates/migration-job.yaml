{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "zkdeal.fullname" . }}-migrate
  labels: {{ include "zkdeal.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "zkdeal.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migrate
          image: {{ include "zkdeal.image" .Values.migration.image | quote }}
          command: {{ required "migration.command must be supplied by the owner capability manifest" .Values.migration.command | toJson }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.global.existingSecret }}, key: {{ .Values.storage.databaseSecretKey }} } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
{{- end }}
