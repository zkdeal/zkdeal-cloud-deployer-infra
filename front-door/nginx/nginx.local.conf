worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  log_format zkdeal '$remote_addr - $request_id [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout zkdeal;
  include /tmp/trusted-proxies.conf;
  resolver 127.0.0.11 valid=2s ipv6=off;

  map $request_method $unsupported_method { default 1; GET 0; HEAD 0; POST 0; PUT 0; DELETE 0; OPTIONS 0; }
  map $query_string $hostile_query { default 0; ~*(?:\.\./|%2e%2e|<script|%3cscript|union(?:%20|\+)+select) 1; }
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=20r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=sse_clients:10m;
  proxy_cache_path /var/cache/nginx/docs levels=1:2 keys_zone=docs_cache:10m max_size=64m inactive=30m use_temp_path=off;

  upstream coordinator_upstream {
    zone coordinator_upstream 64k;
    server coordinator-writer:3000 resolve max_fails=3 fail_timeout=2s;
    keepalive 32;
  }
  upstream docs_upstream {
    zone docs_upstream 32k;
    server docs:8080 max_fails=2 fail_timeout=10s;
    keepalive 8;
  }

  server {
    listen 8088;
    client_max_body_size 2m;
    client_body_timeout 10s;
    keepalive_timeout 15s;

    if ($unsupported_method) { return 405; }
    if ($hostile_query) { return 403; }

    location ~ ^/(?:metrics|admission|indexer|queue)(?:/|$) { return 404; }
    location ~ ^/hosting/v1/(?:admin|indexer|admissions)(?:/|$) { return 404; }

    location = /docs { return 308 /docs/; }
    location /docs/ {
      limit_req zone=public_api burst=40 nodelay;
      proxy_cache docs_cache;
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header X-Request-ID $request_id always;
      proxy_pass http://docs_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location = /hosting/v1/events {
      limit_conn sse_clients 4;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      gzip off;
      proxy_connect_timeout 2s;
      proxy_send_timeout 1h;
      proxy_read_timeout 1h;
      proxy_pass http://coordinator_upstream;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header Last-Event-ID $http_last_event_id;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Accel-Buffering no always;
      add_header Cache-Control "no-store" always;
      add_header X-Request-ID $request_id always;
    }

    location / {
      limit_req zone=public_api burst=40 nodelay;
      proxy_connect_timeout 2s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 1;
      proxy_pass http://coordinator_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      add_header X-Request-ID $request_id always;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
